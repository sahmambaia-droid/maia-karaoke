<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAIA KARAOKÊ — Tela da TV</title><link rel="stylesheet" href="/style.css"><style>body{background:#08090c}main{max-width:1500px}.tvtitle{text-align:center;font-size:clamp(25px,4vw,54px);font-weight:900}.tvname{text-align:center;color:#e8c778;font-size:clamp(17px,2vw,28px);margin:12px}.tvvideo{width:100%;aspect-ratio:16/9;background:#000;border:0;border-radius:12px}</style></head><body><header><h1>MAIA KARAOKÊ</h1><p>Tela de reprodução</p></header><main><div class="tvtitle" id="songTitle">Aguardando a próxima música</div><div class="tvname" id="singer"></div><div id="video"></div><p class="muted" style="text-align:center">Esta tela recebe a música selecionada no painel administrativo.</p></main><script src="/socket.io/socket.io.js"></script><script>const panel=location.pathname.split('/').pop(),$=id=>document.getElementById(id);function show(s){if(!s?.videoId)return;$('songTitle').textContent=s.title||'Música selecionada';$('singer').textContent=s.singer?'🎤 '+s.singer:'';$('video').innerHTML='<iframe class="tvvideo" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen src="https://www.youtube.com/embed/'+encodeURIComponent(s.videoId)+'?autoplay=1"></iframe>'}fetch('/api/panels/'+panel+'/song').then(r=>r.json()).then(show);const socket=io();socket.emit('join-panel',panel);socket.on('song:update',show);</script></body></html>
